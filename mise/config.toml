# Global tools, managed by mise and exposed through shims (~/.local/share/mise/shims).
#
#   mise install             install everything listed here
#   mise outdated            show what has newer releases
#   mise upgrade --bump      upgrade and rewrite the pins below
#   mise prune               remove versions no longer referenced

[tools]
# languages / runtimes
node = "24.22.1"
go = "1.27.3"
rust = "1.99.1"
bun = "1.4.4"
pnpm = "12.15.0"
uv = "0.13.5"

# editor + cli
# explicit backends: the default vfox plugins run Lua on every shim call (~10ms)
"aqua:neovim/neovim" = "0.12.6"
tree-sitter = "0.27.1"
gh = "2.103.3"
lazygit = "0.66.2"
fzf = "0.74.5"
ripgrep = "15.2.0"
fd = "10.5.0"
"cargo:eza" = "0.23.5"
zoxide = "0.10.0"
stylua = "2.6.0"
hyperfine = "2.0.0"

# containers
colima = "0.10.3"
lima = "2.2.1"
docker-cli = "29.9.2"

# go dev tools (previously installed by setup-go)
"go:golang.org/x/tools/gopls" = "0.24.0"
"go:golang.org/x/tools/cmd/goimports" = "0.52.0"
"go:mvdan.cc/gofumpt" = "0.12.0"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"
"go:honnef.co/go/tools/cmd/staticcheck" = "0.8.2"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.15.0"
"go:github.com/fatih/gomodifytags" = "1.17.0"
"go:github.com/josharian/impl" = "1.5.0"
"go:github.com/cweill/gotests/gotests" = "1.9.0"
